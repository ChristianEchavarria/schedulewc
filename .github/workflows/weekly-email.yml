name: Resumen semanal (Mundial 2026)

on:
  schedule:
    # 12:00 Colombia (UTC-5) = 17:00 UTC, cada VIERNES — envía el horario de la semana SIGUIENTE
    - cron: '0 17 * * 5'
  workflow_dispatch:
    inputs:
      send_date:
        description: 'Fecha de prueba YYYY-MM-DD (opcional, debe caer en la semana objetivo)'
        required: false
      dry_run:
        description: 'Poner 1 para NO enviar (solo log)'
        required: false
      only_person:
        description: 'Enviar solo a estas personas (ej. CHRISTIAN o DANY,LAURA). Vacío = todos'
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Enviar resumen semanal
        env:
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
          SEND_DATE: ${{ github.event.inputs.send_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ONLY_PERSON: ${{ github.event.inputs.only_person }}
        run: node mailer/send-emails.js weekly
